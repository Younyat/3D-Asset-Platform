[package]
name = "asset_forge_desktop"
version = "0.1.0"
description = "3D Asset Forge desktop host"
authors = ["3D Asset Forge"]
edition = "2021"

[lib]
name = "asset_forge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
